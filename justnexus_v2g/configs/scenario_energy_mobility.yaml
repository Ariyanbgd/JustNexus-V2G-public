# Optional recipe for variable-day studies. Fixed mode uses the reference
# values above. Each household draws one independent uniform load factor and
# one independent uniform PV factor per generated day. Only listed fields are
# scaled; profile timing, EV hardware, tariffs, and trip energy stay fixed.
day_variation:
  load:
    fields: [base_kw, morning_peak_kw, evening_peak_kw]
    factor_range: [0.80, 1.20]
  pv:
    fields: [peak_kw]
    factor_range: [0.75, 1.25]
  departures:
    # A selected step also becomes the household's disconnection start.
    # Return steps above stay fixed. Times use half-hour steps from midnight.
    all_distinct: true
    step_options_by_household:
      reliable_commuter: [14, 15, 16]
      price_flexible_worker: [17, 18, 19]
      solar_battery_conserver: [20]
      low_power_affordability_home: [12, 13, 14]
      battery_autonomy_home: [16, 17, 18]
